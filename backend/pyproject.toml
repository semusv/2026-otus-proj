[project]
name = "graphrag-backend"
version = "0.3.0"
description = "GraphRAG platform backend: FastAPI + LangGraph (on-premise, no external APIs)"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "alembic>=1.14",
    "bcrypt>=4.2",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "PyJWT>=2.10",
    "python-dotenv>=1.0",
    "PyYAML>=6.0.2",
    "SQLAlchemy[asyncio]>=2.0.40",
    "uvicorn[standard]>=0.34",
    "qdrant-client>=1.19.0",
    "neo4j>=6.2.0",
    "sentence-transformers>=6.0.0",
    "openai>=3.3.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

# CPU-only сборка torch (официальный индекс PyTorch): без CUDA-библиотек ~2-3GB
# в docker-образе; bge-m3 работает на CPU (ADR-009).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "ASYNC", # async pitfalls
    "RUF", # ruff-specific
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках/комментах — намеренно (проект русскоязычный)
    "B008",  # Depends(...) в дефолтах параметров — канонический паттерн FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts и «хардкод» тестовых кредов разрешены в тестах
"scripts/**" = ["S104"]
"backend/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = false  # overrides для migrations/scripts нужны на следующих этапах

[[tool.mypy.overrides]]
module = ["alembic.*", "asyncpg"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["migrations.*", "scripts.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "unit: быстрые тесты без внешних зависимостей",
    "integration: нужен запущенный compose (PostgreSQL и др.)",
    "gpu_slow: LLM-as-a-Judge, запускается вручную",
]
