# ============================================================================
# Observability self-hosted (самостоятельный стек, этап 10)
#
# Отдельный compose-проект (name: graphrag-observability) — по аналогии с
# graphrag-langfuse: живёт независимо от основного стека, другие проекты
# (compose-бэкенды, minikube-бэкенд) подключаются через host-порты:
#   - трейсы OTLP/HTTP: http://127.0.0.1:4318/v1/traces
#       из docker-контейнеров:  http://host.docker.internal:4318/v1/traces
#       из подов minikube:      http://host.minikube.internal:4318/v1/traces
#   - Jaeger UI:  http://127.0.0.1:16686
#   - Prometheus: http://127.0.0.1:9090
#   - Grafana:    http://127.0.0.1:3000  (APP_GRAFANA_ADMIN_USER/PASSWORD)
#
# Запуск: cd infra && docker compose -f docker-compose.observability.yml up -d
# Сеть своя — ни Traefik, ни graphrag_edge не нужны (порты публикуются напрямую).
# ============================================================================

name: graphrag-observability

services:
  otel-collector:
    image: ${APP_DOCKER_REGISTRY:-}otel/opentelemetry-collector-contrib:0.159.0
    container_name: graphrag-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # HTTP OTLP (трейсы) + gRPC; бинд ТОЛЬКО на localhost (закрытый контур)
      - "127.0.0.1:${APP_OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${APP_OTEL_GRPC_PORT:-4317}:4317"
    networks:
      - obs

  jaeger:
    image: ${APP_DOCKER_REGISTRY:-}jaegertracing/all-in-one:1.74.0
    container_name: graphrag-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${APP_JAEGER_UI_PORT:-16686}:16686"
    networks:
      - obs

  prometheus:
    image: ${APP_DOCKER_REGISTRY:-}prom/prometheus:v3.7.3
    container_name: graphrag-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${APP_PROMETHEUS_PORT:-9090}:9090"
    networks:
      - obs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: ${APP_DOCKER_REGISTRY:-}grafana/grafana:12.3.11
    container_name: graphrag-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${APP_GRAFANA_ADMIN_USER:?APP_GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${APP_GRAFANA_ADMIN_PASSWORD:?APP_GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # JSON-дашборды: путь ВНЕ /var/lib/grafana — иначе вложенный маунт
      # конфликтует с томом grafana_data (урок этапа 7)
      - ./grafana/dashboards:/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${APP_GRAFANA_PORT:-3000}:3000"
    networks:
      - obs

networks:
  obs:

volumes:
  prometheus_data:
    name: graphrag_prometheus_data
  grafana_data:
    name: graphrag_grafana_data
