{{/*
PVC без storageClassName -> default StorageClass кластера (minikube: standard/hostpath).
Кастомный класс при необходимости добавить строкой `storageClassName: <name>` в каждый spec.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "graphrag.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage.postgres }}
---
