{{- if .Values.ingress.enabled }}
{{/*
Входная точка кластера. Host НЕ задан (catch-all): вход через
kubectl port-forward svc/ingress-nginx-controller 8080:80 -> http://localhost:8080.
nginx longest-prefix: API-пути уходят на backend, остальное (/) - на frontend SPA.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphrag-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "graphrag.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          {{- range $path := list "/api" "/auth" "/admin" "/health" "/metrics" "/docs" "/redoc" "/openapi.json" "/openapi.yaml" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphrag-web
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "graphrag.labels" . | nindent 4 }}
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
{{- end }}
