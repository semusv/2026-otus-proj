{{- include "graphrag.failNoSecrets" . }}
apiVersion: v1
kind: Secret
metadata:
  name: graphrag-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "graphrag.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | quote }}
  VAULT_ROOT_TOKEN: {{ .Values.secrets.vaultRootToken | quote }}
  # APP_* дублируются здесь всегда: их читает seed-Job (кладёт в Vault) и
  # fallback-режим vault.enabled=false (backend берёт напрямую secretKeyRef).
  # В vault-режиме initContainer перезаписывает эти же переменные в рантайме
  # из /config/secrets.env - источник правды остаётся за Vault.
  APP_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  APP_LANGFUSE_PUBLIC_KEY: {{ .Values.secrets.langfusePublicKey | quote }}
  APP_LANGFUSE_SECRET_KEY: {{ .Values.secrets.langfuseSecretKey | quote }}
