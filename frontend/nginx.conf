# GraphRAG SPA: статика + same-origin прокси на backend по внутренней сети compose.
# CORS в бэкенде нет — браузер ходит только сюда (Traefik -> Host(localhost)).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # API: /api/* (чат SSE), /auth/*, /admin/*
    # Для SSE обязательно отключаем буферизацию и держим соединение открытым.
    location ~ ^/(api|auth|admin)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
    }

    # Живость бэкенда для индикатора в SPA
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Кэшируемая статика сборки Vite (хэш в имени файла)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA-фолбэк: любые маршруты отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
