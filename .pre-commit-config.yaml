# Хуки прекоммита: линтер + форматтер (mypy гоняется отдельно через `make lint`).
# Установка: uv --directory backend run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(md|drawio)$
      - id: end-of-file-fixer
        exclude: \.(md|drawio)$
      - id: check-yaml
      - id: check-added-large-files
