openapi: 3.1.0
info:
  title: GraphRAG Platform API
  description: Платформа мультимодального анализа корпоративных знаний (GraphRAG, закрытый контур). Контракт экспортируется
    в docs/api/openapi.yaml.
  version: 0.4.0
paths:
  /health:
    get:
      tags:
      - system
      summary: Проверка живости сервиса
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /metrics:
    get:
      tags:
      - system
      summary: Метрики Prometheus
      description: HTTP RPS/latency по маршрутам + бизнес-метрики чата/графа (этап 7, ADR-008).
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/login:
    post:
      tags:
      - auth
      summary: 'Вход: выдаёт JWT (HS256) и создаёт сессию в PG'
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Неверные учётные данные или пользователь деактивирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/register:
    post:
      tags:
      - auth
      summary: 'Саморегистрация: роль viewer (только PUBLIC), JWT выдаётся сразу'
      description: 'Открытая регистрация умышленно даёт минимальную роль viewer.


        Расширение доступа (analyst/admin) — только через администратора:

        POST /admin/users. Аудит: auth.register.'
      operationId: register_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '409':
          description: Имя пользователя занято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Неверный формат имени/пароля
  /auth/me:
    get:
      tags:
      - auth
      summary: Профиль текущего пользователя по Bearer-токену
      operationId: me_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Токен отсутствует, недействителен или истёк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/ingest:
    post:
      tags:
      - admin
      summary: Запустить ingestion корпуса (background task; по умолчанию инкрементальный)
      description: 'full=true - форс-полный прогон (пересчёт всех файлов: смена чанкера,

        модели эмбеддингов или процентов грифа). По умолчанию обрабатывается

        только дельта корпуса по sha256 (таблица ingest_files).'
      operationId: start_ingest_admin_ingest_post
      parameters:
      - name: full
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Full
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestStartResponse'
        '403':
          description: Не admin
        '409':
          description: Прогон уже идёт
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/ingest/status:
    get:
      tags:
      - admin
      summary: Статус последнего/текущего прогона ingestion
      operationId: ingest_status_admin_ingest_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestStatusResponse'
        '403':
          description: Не admin
  /admin/stats:
    get:
      tags:
      - admin
      summary: 'Текущее наполнение хранилищ: Qdrant, Neo4j, PostgreSQL (агрегаты)'
      operationId: storage_stats_admin_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageStatsResponse'
        '403':
          description: Не admin
  /admin/users:
    get:
      tags:
      - admin
      summary: Список учётных записей (без секретов)
      operationId: list_users_admin_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '403':
          description: Не admin
    post:
      tags:
      - admin
      summary: Создать учётную запись с указанной ролью
      description: 'Роль задаёт метки доступа: viewer→PUBLIC, analyst→PUBLIC+INTERNAL, admin→все.'
      operationId: add_user_admin_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '403':
          description: Не admin
        '409':
          description: Имя занято
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/users/{user_id}:
    patch:
      tags:
      - admin
      summary: Сменить роль пользователя (метки доступа пересчитаются из роли)
      description: 'Права применяются сразу: clearances резолвятся из БД на каждом запросе,

        повторный вход не требуется. Смена собственной роли запрещена (защита от

        случайной потери последнего админа).'
      operationId: change_user_role_admin_users__user_id__patch
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '403':
          description: Не admin или попытка сменить собственную роль
        '404':
          description: Пользователь не найден
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - admin
      summary: Удалить учётную запись (по умолчанию мягко — деактивация; ?hard=true — физически)
      description: 'hard=false (дефолт): деактивация — вход заблокирован, история/аудит целы.

        hard=true: физическое удаление строки users c чисткой FK-зависимостей

        (chat_messages → chat_sessions → sessions) и обезличиванием audit_log

        (user_id=NULL, события сохраняются). Qdrant/Neo4j не затрагиваются.

        Защиты: нельзя удалить себя; нельзя удалить последнего активного админа.

        Имя освобождается только при hard=true (при soft имя остаётся занятым).'
      operationId: delete_user_admin_users__user_id__delete
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      - name: hard
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Hard
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'
        '403':
          description: Не admin или попытка удалить себя
        '404':
          description: Пользователь не найден
        '409':
          description: Последний активный админ
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/users/{user_id}/status:
    patch:
      tags:
      - admin
      summary: Деактивировать/реактивировать учётную запись (мягкое отключение)
      description: 'Мягкое отключение: is_active=false блокирует вход (login → 401) и

        инвалидирует существующие JWT (любой запрос → 401), история и аудит целы.

        Реактивация возвращает доступ без создания новых сущностей.'
      operationId: set_user_status_admin_users__user_id__status_patch
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '403':
          description: Не admin или попытка изменить себя
        '404':
          description: Пользователь не найден
        '409':
          description: Последний активный админ
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/acts/{act_id}/clearance:
    patch:
      tags:
      - admin
      summary: 'Перекатегоризация акта: сменить гриф (Neo4j + payload чанков Qdrant)'
      description: 'Ручная перекатегоризация (бэклог п.4). Метка меняется синхронно в двух

        хранилищах: Neo4j Act.clearance (метаданные) и payload всех Qdrant-точек

        акта - pre-fetch ACL ретриверов читает метку именно из payload. Доступ

        пересчитывается мгновенно, перезапуск/переиндексация не нужны.'
      operationId: change_act_clearance_admin_acts__act_id__clearance_patch
      parameters:
      - name: act_id
        in: path
        required: true
        schema:
          type: string
          title: Act Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActClearanceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActOut'
        '403':
          description: Не admin
        '404':
          description: Акт не найден
        '422':
          description: Неизвестная метка доступа
  /admin/documents:
    post:
      tags:
      - admin
      summary: Загрузить XML-документы в каталог корпуса (прогон запускается отдельно)
      description: 'Сохраняет файлы в каталог корпуса (APP_INGEST_CORPUS_DIR). Прогон НЕ

        запускается - после загрузки вызовите POST /admin/ingest (обработаются

        только новые/изменившиеся файлы). Валидация: расширение .xml, лимит

        APP_INGEST_MAX_UPLOAD_MB на файл, имя без traversal.'
      operationId: upload_documents_admin_documents_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_documents_admin_documents_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsUploadResponse'
        '403':
          description: Не admin
        '409':
          description: Идёт прогон ingestion
        '500':
          description: Каталог корпуса недоступен
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/documents/{filename}:
    delete:
      tags:
      - admin
      summary: Удалить XML-файл из каталога корпуса (зачистка актов - при следующем ingestion)
      description: 'Удаляет файл с диска. Акты файла остаются в Qdrant/Neo4j до следующего

        прогона: инкрементальный режим увидит исчезновение файла из каталога и

        зачистит их автоматически (files_removed в статистике прогона).'
      operationId: delete_document_admin_documents__filename__delete
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
          title: Filename
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDeleteResponse'
        '403':
          description: Не admin
        '404':
          description: Файл не найден или небезопасное имя
        '409':
          description: Идёт прогон ingestion
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/chat:
    post:
      tags:
      - chat
      summary: Вопрос агенту GraphRAG (SSE-стриминг или JSON при stream=false)
      description: 'Конвейер: guardrails -> planner -> retrieval (вектор+граф, ACL pre-fetch) -> fusion -> rerank -> generate
        -> evaluate (re-plan <= APP_AGENT_MAX_ITERATIONS) -> guardrail_out (проверка цитат).


        При stream=true возвращает text/event-stream: события `status`, `token`, `done`, `error` (формат - event:\ndata:\n\n).
        При stream=false - обычный JSON.'
      operationId: chat_api_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Chat Api Chat Post
        '401':
          description: Нет/невалидный JWT
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/acts/{act_id}/content:
    get:
      tags:
      - acts
      summary: Полный текст акта с метаданными (доступ по метке грифа)
      operationId: act_content_api_acts__act_id__content_get
      parameters:
      - name: act_id
        in: path
        required: true
        schema:
          type: string
          title: Act Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActContentResponse'
        '403':
          description: Метка акта выше уровня доступа роли
        '404':
          description: Акт не найден
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ActClearanceUpdate:
      properties:
        clearance:
          type: string
          enum:
          - PUBLIC
          - INTERNAL
          - SECRET
          title: Clearance
      type: object
      required:
      - clearance
      title: ActClearanceUpdate
      description: 'Ручная перекатегоризация акта админом (бэклог п.4).


        Обновляет метку синхронно в обоих хранилищах: Neo4j (метаданные) и Qdrant

        (payload всех чанков - фильтр pre-fetch ACL читает метку именно оттуда).'
      examples:
      - clearance: SECRET
    ActContentResponse:
      properties:
        act:
          $ref: '#/components/schemas/ActOut'
        chunk_count:
          type: integer
          title: Chunk Count
        full_text:
          type: string
          title: Full Text
      type: object
      required:
      - act
      - chunk_count
      - full_text
      title: ActContentResponse
      description: 'Полный текст акта, собранный из чанков векторного хранилища.


        Выдаётся только если метка акта входит в ACL пользователя (бэклог п.5).'
      examples:
      - act:
          act_id: '920000001'
          clearance: PUBLIC
          date: 15.03.2001
          doc_number: 920000001-ФЗ
          status: Действует без изменений
          title: Об акционерных обществах
        chunk_count: 1
        full_text: Статья 1. ...
    ActOut:
      properties:
        act_id:
          type: string
          title: Act Id
        title:
          type: string
          title: Title
        doc_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Doc Number
        date:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        clearance:
          type: string
          enum:
          - PUBLIC
          - INTERNAL
          - SECRET
          title: Clearance
      type: object
      required:
      - act_id
      - title
      - clearance
      title: ActOut
      description: Метаданные акта из графа знаний.
    Body_upload_documents_admin_documents_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
          description: XML-файлы корпуса (multipart)
      type: object
      required:
      - files
      title: Body_upload_documents_admin_documents_post
    ChatRequest:
      properties:
        message:
          type: string
          maxLength: 8000
          minLength: 1
          title: Message
          description: Вопрос пользователя (санитайзер и guardrails применяются на сервере)
          examples:
          - Какие требования к раскрытию информации эмитентами?
        session_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Session Id
          description: Идентификатор диалога; None - начать новый диалог
        stream:
          type: boolean
          title: Stream
          description: true - SSE-поток событий, false - JSON
          default: true
      type: object
      required:
      - message
      title: ChatRequest
      description: Запрос к агенту; ``stream=False`` возвращает обычный JSON (Postman/нагрузка).
    DeleteUserResponse:
      properties:
        user_id:
          type: string
          title: User Id
        username:
          type: string
          title: Username
        mode:
          type: string
          enum:
          - deactivated
          - deleted
          title: Mode
      type: object
      required:
      - user_id
      - username
      - mode
      title: DeleteUserResponse
      description: Итог удаления учётной записи (DELETE /admin/users/{id}?hard=true|false).
      examples:
      - mode: deleted
        user_id: '...'
        username: qa_x
      - mode: deactivated
        user_id: '...'
        username: qa_x
    DocumentDeleteResponse:
      properties:
        filename:
          type: string
          title: Filename
        message:
          type: string
          title: Message
          default: Файл удалён из корпуса; акты зачистятся при следующем ingestion
      type: object
      required:
      - filename
      title: DocumentDeleteResponse
      description: Итог удаления файла из корпуса (DELETE /admin/documents/{filename}).
    DocumentsUploadResponse:
      properties:
        saved:
          items:
            type: string
          type: array
          title: Saved
          description: Имена сохранённых в корпус файлов
        rejected:
          items:
            $ref: '#/components/schemas/UploadRejection'
          type: array
          title: Rejected
        message:
          type: string
          title: Message
          default: Файлы сохранены в каталог корпуса; запустите POST /admin/ingest
      type: object
      required:
      - saved
      title: DocumentsUploadResponse
      description: 'Итог загрузки XML в каталог корпуса (POST /admin/documents).


        Загрузка ТОЛЬКО сохраняет файлы - прогон запускается отдельно

        (POST /admin/ingest). Прогон считается инкрементально: обработаются

        только новые/изменившиеся файлы.'
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Details
      type: object
      required:
      - code
      - message
      title: ErrorResponse
      description: Тело ошибки домена/валидации.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IngestStartResponse:
      properties:
        state:
          type: string
          const: started
          title: State
          default: started
        message:
          type: string
          title: Message
          default: Прогон ingestion запущен
      type: object
      title: IngestStartResponse
    IngestStatusResponse:
      properties:
        state:
          type: string
          enum:
          - idle
          - running
          - done
          - error
          title: State
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        stats:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Stats
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        stage:
          anyOf:
          - type: string
            enum:
            - parse
            - model
            - processing
            - done
            - error
          - type: 'null'
          title: Stage
        files_done:
          anyOf:
          - type: integer
          - type: 'null'
          title: Files Done
        files_total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Files Total
        chunks_done:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chunks Done
      type: object
      required:
      - state
      title: IngestStatusResponse
    LoginRequest:
      properties:
        username:
          type: string
          maxLength: 64
          minLength: 3
          pattern: ^[a-zA-Z0-9_.-]+$
          title: Username
          description: Имя пользователя
        password:
          type: string
          maxLength: 72
          minLength: 8
          title: Password
          description: Пароль (bcrypt на сервере)
      type: object
      required:
      - username
      - password
      title: LoginRequest
      description: Тело запроса логина.
      examples:
      - password: analyst123
        username: analyst
    MeResponse:
      properties:
        user_id:
          type: string
          title: User Id
        username:
          type: string
          title: Username
        role:
          type: string
          title: Role
        clearances:
          items:
            type: string
          type: array
          title: Clearances
          description: Метки доступа роли (ACL для pre-fetch фильтров)
      type: object
      required:
      - user_id
      - username
      - role
      - clearances
      title: MeResponse
      description: Профиль текущего пользователя (по Bearer-токену).
    Neo4jStats:
      properties:
        acts:
          type: integer
          title: Acts
        authorities:
          type: integer
          title: Authorities
        topics:
          type: integer
          title: Topics
        concepts:
          type: integer
          title: Concepts
        relationships:
          type: integer
          title: Relationships
      type: object
      required:
      - acts
      - authorities
      - topics
      - concepts
      - relationships
      title: Neo4jStats
      description: Узлы и рёбра графа знаний (по меткам онтологии ADR-006).
    PostgresStats:
      properties:
        users:
          type: integer
          title: Users
        chat_sessions:
          type: integer
          title: Chat Sessions
        chat_messages:
          type: integer
          title: Chat Messages
      type: object
      required:
      - users
      - chat_sessions
      - chat_messages
      title: PostgresStats
      description: Учётные записи и история диалогов.
    QdrantStats:
      properties:
        collection:
          type: string
          title: Collection
        points:
          type: integer
          title: Points
      type: object
      required:
      - collection
      - points
      title: QdrantStats
      description: Наполнение векторного хранилища.
    StorageStatsResponse:
      properties:
        qdrant:
          $ref: '#/components/schemas/QdrantStats'
        neo4j:
          $ref: '#/components/schemas/Neo4jStats'
        postgres:
          $ref: '#/components/schemas/PostgresStats'
      type: object
      required:
      - qdrant
      - neo4j
      - postgres
      title: StorageStatsResponse
      description: Снимок текущего наполнения хранилищ (без прогресса прогонов).
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          const: bearer
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
          description: TTL токена, секунды
        username:
          type: string
          title: Username
        role:
          type: string
          title: Role
      type: object
      required:
      - access_token
      - expires_in
      - username
      - role
      title: TokenResponse
      description: 'Успешный логин: JWT + метаданные сессии.'
      examples:
      - access_token: eyJhbGciOiJIUzI1NiIs...
        expires_in: 1800
        role: analyst
        token_type: bearer
        username: analyst
    UploadRejection:
      properties:
        filename:
          type: string
          title: Filename
        reason:
          type: string
          title: Reason
      type: object
      required:
      - filename
      - reason
      title: UploadRejection
      description: Файл, отклонённый при загрузке, с причиной.
    UserCreate:
      properties:
        username:
          type: string
          maxLength: 64
          minLength: 3
          pattern: ^[a-zA-Z0-9_.-]+$
          title: Username
          description: Имя пользователя (уникально)
        password:
          type: string
          maxLength: 72
          minLength: 8
          title: Password
          description: Пароль (bcrypt на сервере)
        role:
          type: string
          enum:
          - viewer
          - analyst
          - admin
          title: Role
          description: Роль определяет метки доступа
          default: viewer
      type: object
      required:
      - username
      - password
      title: UserCreate
      description: Создание учётной записи администратором.
      examples:
      - password: qa123456
        role: viewer
        username: qa_viewer
    UserOut:
      properties:
        user_id:
          type: string
          title: User Id
        username:
          type: string
          title: Username
        role:
          type: string
          enum:
          - viewer
          - analyst
          - admin
          title: Role
        clearances:
          items:
            type: string
          type: array
          title: Clearances
          description: Метки доступа роли
        is_active:
          type: boolean
          title: Is Active
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - user_id
      - username
      - role
      - clearances
      - is_active
      - created_at
      title: UserOut
      description: Учётная запись без секретов.
    UserRoleUpdate:
      properties:
        role:
          type: string
          enum:
          - viewer
          - analyst
          - admin
          title: Role
      type: object
      required:
      - role
      title: UserRoleUpdate
      description: Смена роли пользователя админом; метки доступа пересчитаются из роли.
      examples:
      - role: analyst
    UserStatusUpdate:
      properties:
        is_active:
          type: boolean
          title: Is Active
      type: object
      required:
      - is_active
      title: UserStatusUpdate
      description: Неактивный пользователь не может войти; существующие JWT отклоняются
      examples:
      - is_active: false
    UsersListResponse:
      properties:
        users:
          items:
            $ref: '#/components/schemas/UserOut'
          type: array
          title: Users
      type: object
      required:
      - users
      title: UsersListResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
