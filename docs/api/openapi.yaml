openapi: 3.1.0
info:
  title: GraphRAG Platform API
  description: Платформа мультимодального анализа корпоративных знаний (GraphRAG, закрытый контур). Контракт экспортируется
    в docs/api/openapi.yaml.
  version: 0.4.0
paths:
  /health:
    get:
      tags:
      - system
      summary: Проверка живости сервиса
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /metrics:
    get:
      tags:
      - system
      summary: Метрики Prometheus
      description: Базовый эндпоинт; полные метрики этапа 7 (ADR-008).
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/login:
    post:
      tags:
      - auth
      summary: 'Вход: выдаёт JWT (HS256) и создаёт сессию в PG'
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Неверные учётные данные или пользователь деактивирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/me:
    get:
      tags:
      - auth
      summary: Профиль текущего пользователя по Bearer-токену
      operationId: me_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Токен отсутствует, недействителен или истёк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/ingest:
    post:
      tags:
      - admin
      summary: Запустить ingestion корпуса (background task)
      operationId: start_ingest_admin_ingest_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestStartResponse'
        '403':
          description: Не admin
        '409':
          description: Прогон уже идёт
  /admin/ingest/status:
    get:
      tags:
      - admin
      summary: Статус последнего/текущего прогона ingestion
      operationId: ingest_status_admin_ingest_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestStatusResponse'
        '403':
          description: Не admin
  /api/chat:
    post:
      tags:
      - chat
      summary: Вопрос агенту GraphRAG (SSE-стриминг или JSON при stream=false)
      description: 'Конвейер: guardrails -> planner -> retrieval (вектор+граф, ACL pre-fetch) -> fusion -> rerank -> generate
        -> evaluate (re-plan <= APP_AGENT_MAX_ITERATIONS) -> guardrail_out (проверка цитат).


        При stream=true возвращает text/event-stream: события `status`, `token`, `done`, `error` (формат - event:\ndata:\n\n).
        При stream=false - обычный JSON.'
      operationId: chat_api_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Chat Api Chat Post
        '401':
          description: Нет/невалидный JWT
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ChatRequest:
      properties:
        message:
          type: string
          maxLength: 8000
          minLength: 1
          title: Message
          description: Вопрос пользователя (санитайзер и guardrails применяются на сервере)
          examples:
          - Какие требования к раскрытию информации эмитентами?
        session_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Session Id
          description: Идентификатор диалога; None - начать новый диалог
        stream:
          type: boolean
          title: Stream
          description: true - SSE-поток событий, false - JSON
          default: true
      type: object
      required:
      - message
      title: ChatRequest
      description: Запрос к агенту; ``stream=False`` возвращает обычный JSON (Postman/нагрузка).
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Details
      type: object
      required:
      - code
      - message
      title: ErrorResponse
      description: Тело ошибки домена/валидации.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IngestStartResponse:
      properties:
        state:
          type: string
          const: started
          title: State
          default: started
        message:
          type: string
          title: Message
          default: Прогон ingestion запущен
      type: object
      title: IngestStartResponse
    IngestStatusResponse:
      properties:
        state:
          type: string
          enum:
          - idle
          - running
          - done
          - error
          title: State
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        stats:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Stats
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - state
      title: IngestStatusResponse
    LoginRequest:
      properties:
        username:
          type: string
          maxLength: 64
          minLength: 3
          pattern: ^[a-zA-Z0-9_.-]+$
          title: Username
          description: Имя пользователя
        password:
          type: string
          maxLength: 72
          minLength: 8
          title: Password
          description: Пароль (bcrypt на сервере)
      type: object
      required:
      - username
      - password
      title: LoginRequest
      description: Тело запроса логина.
      examples:
      - password: analyst123
        username: analyst
    MeResponse:
      properties:
        user_id:
          type: string
          title: User Id
        username:
          type: string
          title: Username
        role:
          type: string
          title: Role
        clearances:
          items:
            type: string
          type: array
          title: Clearances
          description: Метки доступа роли (ACL для pre-fetch фильтров)
      type: object
      required:
      - user_id
      - username
      - role
      - clearances
      title: MeResponse
      description: Профиль текущего пользователя (по Bearer-токену).
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          const: bearer
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
          description: TTL токена, секунды
        username:
          type: string
          title: Username
        role:
          type: string
          title: Role
      type: object
      required:
      - access_token
      - expires_in
      - username
      - role
      title: TokenResponse
      description: 'Успешный логин: JWT + метаданные сессии.'
      examples:
      - access_token: eyJhbGciOiJIUzI1NiIs...
        expires_in: 1800
        role: analyst
        token_type: bearer
        username: analyst
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: system
  description: Здоровье сервиса и метрики
- name: auth
  description: Аутентификация и профиль пользователя
- name: admin
  description: Управление ingestion корпуса (роль admin)
- name: chat
  description: Вопросы к GraphRAG-агенту (SSE-стриминг)
